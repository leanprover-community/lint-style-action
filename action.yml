name: "Mathlib style linter"
description: |
  Text-based linters to ensure Lean code meets Mathlib style guidelines.
  This action will automatically make suggestions to PRs to fix style issues.

  This action is intended to run in multiple workflows, with different `mode` settings.
  * on pushes to branches, run this action in mode `check` to run the linters.
  * on `pull_request`, run this action in mode `suggest` to run the linters and comment with suggestions.
  * on `pull_request`, run this action in mode `fix-worktree` to apply the fixes to the working tree
    without commenting, for a workflow that pushes them itself (e.g. with `pre-commit-ci/lite-action`).

inputs:
  mode:
    description: |
      The actions taken based on style linter output.
      When set to `check`, this action runs the style linters.
      When set to `suggest`, this action adds review comments with suggestions.
      When set to `fix-worktree`, this action applies the same fixes as `suggest` but leaves them
      uncommitted in the working tree instead of posting review comments.
      Allowed values: "check", "suggest" or "fix-worktree".
    required: true
  lint-bib-file:
    description: |
      Enables linting of the bibiliography using `./scripts/lint-bib.sh`.
    required: false
    default: "false"
  ref:
    description: |
      The branch, tag or SHA to lint. This defaults to the reference or SHA for the event that triggered the workflow.
    default: ''
    required: false

outputs:
  unfixable-errors:
    description: |
      (In `suggest` and `fix-worktree` modes:) Did the linters report an error that their automatic
      fixes could not repair?
      Allowed values: "true" | "false"
    value: ${{ steps.lint_style.outputs.unfixable == 'true' || steps.lint_bib.outputs.unfixable == 'true' }}

runs:
  using: "composite"
  steps:
    # Every later step can rely on `inputs.mode` being one of the values below: if it is not, this
    # step fails and the rest are skipped. So only the steps that differ between modes test it.
    - name: Check the mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        case "${MODE}" in
          check|suggest|fix-worktree) ;;
          *)
            printf '::error::unknown mode %s: expected one of check, suggest, fix-worktree\n' "${MODE}"
            exit 1
            ;;
        esac

    - name: cleanup
      shell: bash
      run: |
        find . -name . -o -prune -exec rm -rf -- {} +

    - name: Checkout PR branch
      uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
      with:
        ref: ${{ inputs.ref }}

    # Run the case checker action
    - name: Check Case Sensitivity
      if: ${{ inputs.mode == 'check' }}
      uses: credfeto/action-case-checker@cb652aeab29ed363bbdb7d9ee1bfcc010c46cac5 # v1.3.0

    - name: Look for ignored files
      if: ${{ inputs.mode == 'check' }}
      uses: credfeto/action-no-ignored-files@4fccae50720d89bef0cd9dc99a85a19b765d2e70 # v1.2.0

    - name: "Check for Lean files with the executable bit set"
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      run: |
        executable_files="$(find . -name '*.lean' -type f \( -perm -u=x -o -perm -g=x -o -perm -o=x \))"
        if [[ -n "$executable_files" ]]
        then
          echo "ERROR: The following Lean files have the executable bit set."
          echo "$executable_files"
          exit 1
        fi


    - name: Configure Lean
      uses: leanprover/lean-action@96e06131c0e9943c780388fd166f55d1e2fa0433 # v1.6.0
      with:
        auto-config: false
        use-github-cache: false
        use-mathlib-cache: false

    # This comes before `lake exe lint-style`, which only lints the modules these files import: so in
    # `fix-worktree` mode a module the pull request adds without importing it is linted, and fixed, in
    # the same run. (In `suggest` mode the order makes no difference, because each suggester step
    # discards the changes it has just commented on.)
    - name: update {Mathlib, Tactic, Counterexamples, Archive}.lean
      if: ${{ inputs.mode == 'suggest' || inputs.mode == 'fix-worktree' }}
      shell: bash
      run: |
        # a non-zero exit here means the import list was out of date, which is the change the
        # following steps suggest or hand over, not a failure
        lake exe mk_all || true

    - name: suggester / import list
      if: ${{ inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
      with:
        tool_name: imports

    - name: lint
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      run: |
        lake exe lint-style

    - name: lint
      id: lint_style
      if: ${{ inputs.mode == 'suggest' || inputs.mode == 'fix-worktree' }}
      shell: bash
      run: |
        lake exe lint-style --fix
        # `--fix` makes `lint-style` exit zero whatever it found, so run it again without: anything it
        # still reports is something the fixes could not repair. This is one more pass over the files,
        # not another build.
        if lake exe lint-style; then
          printf 'unfixable=false\n' >> "${GITHUB_OUTPUT}"
        else
          printf 'unfixable=true\n' >> "${GITHUB_OUTPUT}"
        fi

    - name: suggester / lint-style
      if: ${{ inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
      with:
        tool_name: lint-style

    - name: Install bibtool
      if: ${{ inputs.lint-bib-file == 'true' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bibtool

    - name: lint references.bib (check)
      if: ${{ inputs.lint-bib-file == 'true' && inputs.mode == 'check' }}
      shell: bash
      run: |
        ./scripts/lint-bib.sh

    - name: lint references.bib (suggest/fix-worktree)
      id: lint_bib
      if: ${{ inputs.lint-bib-file == 'true' && (inputs.mode == 'suggest' || inputs.mode == 'fix-worktree') }}
      shell: bash
      run: |
        # `lint-bib.sh` exits non-zero both when it rewrote the file -- the change the following
        # steps suggest or hand over, not a failure -- and when it found something it cannot fix,
        # such as a key with a forbidden character. A second run tells the two apart: the rewritten
        # file is already in the form the script wants, so only a problem it cannot fix fails again.
        if ./scripts/lint-bib.sh || ./scripts/lint-bib.sh; then
          printf 'unfixable=false\n' >> "${GITHUB_OUTPUT}"
        else
          printf 'unfixable=true\n' >> "${GITHUB_OUTPUT}"
        fi
        # The script leaves the original behind as `docs/references.bib.old`, which mathlib4 does
        # not gitignore. In `fix-worktree` mode a workflow that commits untracked files (with
        # `git add -A`, say) would pick it up. (In `suggest` mode the suggester's `git stash -u`
        # already sweeps it away.)
        rm -f docs/references.bib.old

    - name: suggester / lint-bib
      if: ${{ inputs.lint-bib-file == 'true' && inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@c387862ad6765a9729f2b40ee4d8b5769f2145c7 # v1.26.1
      with:
        tool_name: lint-bib
