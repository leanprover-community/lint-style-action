name: "Mathlib style linter"
description: |
  Text-based linters to ensure Lean code meets Mathlib style guidelines.
  This action will automatically make suggestions to PRs to fix style issues.

  This action is intended to run in multiple workflows, with different `mode` settings.
  * on pushes to branches, run this action in mode `check` to run the linters.
  * on `pull_request`, run this action in mode `suggest` to run the linters and comment with suggestions.
  * on `pull_request`, run this action in mode `autofix` to run the linters and leave the fixes in the
    working tree, without commenting. This is for callers that push the fixes themselves (e.g. via
    `pre-commit-ci/lite-action`); it is `suggest` minus the review comments.

inputs:
  mode:
    description: |
      The actions taken based on style linter output.
      When set to `check`, this action runs the style linters.
      When set to `suggest`, this action adds review comments with suggestions.
      When set to `autofix`, this action applies the same fixes as `suggest` but leaves them
      uncommitted in the working tree instead of posting review comments. The caller is
      responsible for doing something with them.
      Allowed values: "check", "suggest" or "autofix".
    required: true
  lint-bib-file:
    description: |
      Enables linting of the bibiliography using `./scripts/lint-bib.sh`.
    required: false
    default: "false"
  ref:
    description: |
      The branch, tag or SHA to lint. This defaults to the reference or SHA for the event that triggered the workflow.
    default: ''
    required: false

runs:
  using: "composite"
  steps:
    - name: cleanup
      if: ${{ inputs.mode == 'check' || inputs.mode == 'suggest' || inputs.mode == 'autofix' }}
      shell: bash
      run: |
        find . -name . -o -prune -exec rm -rf -- {} +

    - name: Checkout PR branch
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.ref }}
      if: ${{ inputs.mode == 'check' || inputs.mode == 'suggest' || inputs.mode == 'autofix' }}

    # Run the case checker action
    - name: Check Case Sensitivity
      if: ${{ inputs.mode == 'check' }}
      uses: credfeto/action-case-checker@cb652aeab29ed363bbdb7d9ee1bfcc010c46cac5 # v1.3.0

    - name: Look for ignored files
      if: ${{ inputs.mode == 'check' }}
      uses: credfeto/action-no-ignored-files@4fccae50720d89bef0cd9dc99a85a19b765d2e70 # v1.2.0

    - name: "Check for Lean files with the executable bit set"
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      run: |
        executable_files="$(find . -name '*.lean' -type f \( -perm -u=x -o -perm -g=x -o -perm -o=x \))"
        if [[ -n "$executable_files" ]]
        then
          echo "ERROR: The following Lean files have the executable bit set."
          echo "$executable_files"
          exit 1
        fi


    - name: install Python
      if: ${{ inputs.mode == 'check' || inputs.mode == 'suggest' || inputs.mode == 'autofix' }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: 3.8

    - name: Configure Lean
      if: ${{ inputs.mode == 'check' || inputs.mode == 'suggest' || inputs.mode == 'autofix' }}
      uses: leanprover/lean-action@f807b338d95de7813c5c50d018f1c23c9b93b4ec # 2025-04-24
      with:
        auto-config: false
        use-github-cache: false
        use-mathlib-cache: false

    - name: lint
      if: ${{ inputs.mode == 'check' }}
      shell: bash
      run: |
        lake exe lint-style

    - name: lint
      if: ${{ inputs.mode == 'suggest' || inputs.mode == 'autofix' }}
      shell: bash
      run: |
        lake exe lint-style --fix

    - name: suggester / lint-style
      if: ${{ inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@4747dbc9f9e37adba0943e681cc20db466642158 # v1.21.0
      with:
        tool_name: lint-style

    - name: Install bibtool
      if: ${{ inputs.lint-bib-file == 'true' && (inputs.mode == 'check' || inputs.mode == 'suggest' || inputs.mode == 'autofix') }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y bibtool

    - name: lint references.bib (check)
      if: ${{ inputs.lint-bib-file == 'true' && inputs.mode == 'check' }}
      shell: bash
      run: |
        ./scripts/lint-bib.sh

    - name: lint references.bib (suggest/autofix)
      if: ${{ inputs.lint-bib-file == 'true' && (inputs.mode == 'suggest' || inputs.mode == 'autofix') }}
      shell: bash
      run: |
        # `lint-bib.sh` exits non-zero when it rewrote the file; ignoring that lets the
        # `reviewdog` step below turn the rewrite into suggestions, and lets `autofix` carry
        # on to the remaining fixers
        ./scripts/lint-bib.sh || true

    - name: suggester / lint-bib
      if: ${{ inputs.lint-bib-file == 'true' && inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@4747dbc9f9e37adba0943e681cc20db466642158 # v1.21.0
      with:
        tool_name: lint-bib

    - name: remove references.bib backup
      # `scripts/lint-bib.sh` copies `docs/references.bib` to `docs/references.bib.old` before
      # rewriting it. `suggest` mode never shows that file to anyone, but `autofix` hands the
      # working tree to the caller, and mathlib4 does not gitignore the path -- so without this
      # the backup lands in whatever commit the caller makes.
      if: ${{ inputs.lint-bib-file == 'true' && inputs.mode == 'autofix' }}
      shell: bash
      run: rm -f docs/references.bib.old

    - name: update {Mathlib, Tactic, Counterexamples, Archive}.lean
      if: ${{ inputs.mode == 'suggest' || inputs.mode == 'autofix' }}
      shell: bash
      run: |
        # as with `lint-bib.sh` above: a non-zero exit here means the import list was out of
        # date, which is the thing the following steps are meant to report or apply, not a failure
        lake exe mk_all || true

    - name: suggester / import list
      if: ${{ inputs.mode == 'suggest' }}
      uses: reviewdog/action-suggester@4747dbc9f9e37adba0943e681cc20db466642158 # v1.21.0
      with:
        tool_name: imports
